<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Skybreak Siege</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Saira+Semi+Condensed:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas; lobby menu docked left (bottom sheet on phones); HUD pinned to screen edges */
:root{--ink:#0a111f;--panel:rgba(11,18,33,.84);--panel2:rgba(24,38,64,.92);--line:rgba(150,195,255,.2);--text:#e9f2ff;--dim:#8ea4c4;--accent:#ff7a1a;--accent2:#ffb15c;--ice:#5fd0ff;--good:#4ade80;--bad:#ff5468;--gold:#ffcf4a;--scrap:#c3ccd9;--core:#52f0e0;--f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--f-body:'Saira Semi Condensed','Segoe UI',Roboto,Arial,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.abs{position:absolute}
[hidden]{display:none!important}

/* lobby */
#lobby{position:absolute;inset:0;pointer-events:none;display:flex}
.menu{pointer-events:auto;width:min(470px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(90deg,rgba(8,13,25,.86),rgba(8,13,25,.55) 80%,transparent)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,8vw,70px);line-height:.86;letter-spacing:.01em;text-transform:uppercase;margin:0}
.logo span{display:block;font-size:.5em;letter-spacing:.34em;color:var(--accent);margin-top:6px}
.sub{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.coins{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;font-weight:700;font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.coins i{width:14px;height:14px;background:var(--gold);transform:rotate(45deg);display:block}
.name{display:flex;gap:8px;align-items:center}
.name input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 11px;font:600 15px var(--f-body);letter-spacing:.04em}
.name input:focus,button:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;font:700 20px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pad{padding:14px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{background:var(--panel);border:1px solid var(--line);padding:12px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font:900 38px/1 var(--f-display)}
.mode strong{font:700 17px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.mode small{color:var(--dim);font-size:12px}
.mode.on{border-color:var(--accent);background:rgba(255,122,26,.14)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;background:var(--panel);border:0;padding:9px;font:700 16px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button.on{background:var(--accent);color:#1a0d02}
.lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
.deploy{border:0;background:var(--accent);color:#1a0d02;font:900 34px var(--f-display);letter-spacing:.14em;text-transform:uppercase;padding:14px 20px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 100%,18px 100%);width:100%}
.deploy:hover{background:var(--accent2)}
.note{font-size:13px;color:var(--dim);line-height:1.45}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.keys b{color:var(--accent2);font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.item{background:var(--panel);border:1px solid var(--line);padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.item.sel{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice) inset}
.sw{height:46px;display:grid;grid-template-columns:2fr 1fr 1fr}
.item .nm{font:700 17px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.tag{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.tag.own{color:var(--good)}
.tag.eq{color:var(--ice)}
.tag i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg);display:inline-block}
.act{border:0;background:var(--ice);color:#04121c;font:800 18px var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:10px}
.act.buy{background:var(--gold)}
.act[disabled]{background:#33425c;color:#7d8fae;cursor:not-allowed}
@media (max-width:760px){.menu{width:100%;justify-content:flex-end;background:linear-gradient(0deg,rgba(8,13,25,.95) 55%,transparent);height:62%;margin-top:auto}.logo{font-size:44px}}

/* hud */
#hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
#hud>*{position:absolute}
#beds{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px}
.tb{display:flex;align-items:center;gap:7px;background:rgba(8,13,25,.7);border:1px solid var(--line);padding:4px 9px;font:700 17px var(--f-display);letter-spacing:.05em}
.tb i{width:12px;height:12px;display:block}
.tb.me{border-color:var(--ice)}
.tb.out{opacity:.4}
.tb em{font-style:normal;font-size:13px;color:var(--dim)}
#feed{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:46vw}
#feed div{background:rgba(8,13,25,.7);padding:4px 9px;font-size:14px;font-weight:600;border-right:3px solid var(--accent)}
#res{top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
#res div{display:flex;align-items:center;gap:8px;background:rgba(8,13,25,.7);padding:4px 10px;font:700 20px var(--f-display);min-width:86px}
#res i{width:11px;height:11px;display:block;transform:rotate(45deg)}
#cross{left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000;opacity:.9}
#cross i:nth-child(1){width:2px;height:8px;left:-1px;top:calc(-8px - var(--g,6px))}
#cross i:nth-child(2){width:2px;height:8px;left:-1px;top:var(--g,6px)}
#cross i:nth-child(3){height:2px;width:8px;top:-1px;left:calc(-8px - var(--g,6px))}
#cross i:nth-child(4){height:2px;width:8px;top:-1px;left:var(--g,6px)}
#hit{left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .25s}
#hit::before,#hit::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:3px;margin:-1.5px 0 0 -13px;background:var(--hc,#fff);transform:rotate(45deg)}
#hit::after{transform:rotate(-45deg)}
#hit.on{opacity:1;transition:none}
#scope{inset:0;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 27vmin,#000 27.4vmin)}
#scope::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
#scope::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#000}
#banner{top:18%;left:0;right:0;text-align:center;font:900 clamp(34px,6vw,64px) var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 3px 18px #000;opacity:0;transition:opacity .4s}
#banner.on{opacity:1}
#banner small{display:block;font:600 18px var(--f-body);letter-spacing:.16em;color:var(--accent2)}
#dmg{inset:0;box-shadow:inset 0 0 90px 10px rgba(255,60,60,0);transition:box-shadow .4s}
#dmg.on{box-shadow:inset 0 0 90px 10px rgba(255,60,60,.55);transition:none}
#dir{left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .6s}
#dir i{position:absolute;left:-30px;top:-140px;width:60px;height:14px;background:var(--bad);clip-path:polygon(0 100%,50% 0,100% 100%)}
#dir.on{opacity:.9;transition:none}
#vitals{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(260px,40vw);display:flex;flex-direction:column;gap:5px}
.bar{height:14px;background:rgba(8,13,25,.75);border:1px solid var(--line);position:relative}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--good)}
.bar.ar b{background:var(--ice)}
.bar span{position:absolute;right:5px;top:-2px;font:700 13px var(--f-display);text-shadow:0 1px 2px #000}
#hotbar{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px}
.slot{width:clamp(44px,8vw,66px);height:clamp(44px,8vw,52px);background:rgba(8,13,25,.72);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 13px var(--f-display);letter-spacing:.04em;color:var(--dim);position:relative;text-transform:uppercase;line-height:1.1;text-align:center}
.slot s{position:absolute;left:3px;top:1px;text-decoration:none;font-size:11px;color:var(--accent2)}
.slot.on{border-color:var(--accent);color:var(--text);background:rgba(255,122,26,.2)}
.slot.no{opacity:.35}
#ammo{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:right;font:900 54px/0.9 var(--f-display);text-shadow:0 2px 10px #000}
#ammo small{display:block;font:700 16px var(--f-display);letter-spacing:.12em;color:var(--dim);margin-top:2px}
#hint{left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:700 18px var(--f-display);letter-spacing:.1em;text-transform:uppercase;background:rgba(8,13,25,.75);padding:6px 14px;border:1px solid var(--line)}
#resume{inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(6,10,20,.55);font:800 30px var(--f-display);letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:20px;cursor:pointer}
#resume small{display:block;font:500 14px var(--f-body);letter-spacing:.05em;color:var(--dim);margin-top:8px;text-transform:none;line-height:1.5}

/* shop + result */
#shop,#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,.7);padding:16px;pointer-events:auto}
.sheet{width:min(780px,100%);max-height:100%;overflow:auto;background:var(--panel2);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font:900 38px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.sh{background:rgba(8,13,25,.7);border:1px solid var(--line);padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.sh:hover:not([disabled]){border-color:var(--accent)}
.sh[disabled]{opacity:.45;cursor:not-allowed}
.sh b{font:700 18px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.sh span{font-size:13px;color:var(--dim)}
.sh em{font-style:normal;font:700 15px var(--f-display);display:flex;gap:10px;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:rgba(8,13,25,.7);border:1px solid var(--line);padding:10px}
.stats b{display:block;font:900 34px/1 var(--f-display)}
.stats span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .act{flex:1;min-width:140px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);font:900 28px var(--f-display);letter-spacing:.3em;text-transform:uppercase;z-index:5}

/* online server browser */
.sv{--o:#ff4f2e;--od:#c93a1e;--ln:#d6dae6;background:#fff;color:#1a2240;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 34px rgba(0,0,0,.4);font-family:'Fredoka','Segoe UI',Arial,sans-serif;font-weight:600;-webkit-user-select:none;user-select:none}
.sv *{font-family:inherit}
.sv-top{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.sv-top b{font-weight:700}.sv-top a{text-decoration:underline;color:#3b4468;cursor:pointer;font-size:16px}
.sv-h{margin:0;font-size:34px;font-weight:700;line-height:1;letter-spacing:.01em}
.ping{border:2px solid var(--ln);border-radius:14px;padding:6px 12px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--ln)}
.quick{border:0;background:var(--o);color:#fff;border-radius:16px;padding:14px;font-size:27px;font-weight:700;box-shadow:0 5px 0 var(--od);cursor:pointer}
.quick:active{transform:translateY(3px);box-shadow:0 2px 0 var(--od)}
.regs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.regs button:nth-child(n+5){grid-column:span 2}
.regs button,.mk{background:#fff;border:2px solid var(--ln);border-radius:14px;padding:8px 4px;font-size:16px;font-weight:700;color:#1a2240;box-shadow:0 3px 0 var(--ln);cursor:pointer}
.regs button.on{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 3px 0 var(--od)}
.srvs{display:flex;flex-direction:column;gap:10px}
.srv{display:flex;align-items:center;gap:10px;border:2px solid var(--ln);border-radius:18px;padding:11px 12px 11px 14px;box-shadow:0 3px 0 var(--ln)}
.sv-l{flex:1;min-width:0}.sv-n{font-size:22px;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-m{display:flex;align-items:center;gap:8px;color:#6a7392;font-size:15px;margin-top:5px;flex-wrap:wrap}
.bd{border-radius:9px;padding:1px 9px;font-size:12px;font-weight:700;background:#dde1ea;color:#4a5272}
.bd.op{background:#d4f5de;color:#176b3a}.bd.pl{background:#ffe2b8;color:#9a5200}.bd.fu{background:#ffd3d3;color:#a02020}
.sv-c{text-align:right;line-height:1.05}.sv-c b{display:block;font-size:24px;font-weight:700}.sv-c span{font-size:13px;color:#6a7392}
.jn{background:#fff;border:2px solid var(--ln);border-radius:14px;padding:9px 16px;font-size:18px;font-weight:700;color:#1a2240;box-shadow:0 3px 0 var(--ln);cursor:pointer;white-space:nowrap}
.jn:hover:not([disabled]),.regs button:hover:not(.on),.mk:hover{background:#f3f5fa}
.jn[disabled]{opacity:.45;cursor:not-allowed}
.priv{display:flex;gap:8px}
.sv-in{flex:1;min-width:0;border:2px solid var(--ln);border-radius:14px;padding:11px 13px;font-size:18px;font-weight:600;color:#1a2240;background:#fff;-webkit-user-select:text;user-select:text}
.sv-in::placeholder{color:#8b93ad}
.sv-in:focus{outline:2px solid var(--o);outline-offset:0}
.sv-note{color:#6a7392;font-size:15px;line-height:1.35}
.pseg{display:flex;gap:8px}.pseg button{flex:1;border:2px solid var(--ln);background:#fff;border-radius:14px;padding:9px;font-size:18px;font-weight:700;color:#1a2240;box-shadow:0 3px 0 var(--ln);cursor:pointer}
.pseg button.on{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 3px 0 var(--od)}
.stp{display:flex;align-items:center;justify-content:space-between;font-size:19px;font-weight:700}
.stp div{display:flex;align-items:center;gap:10px}.stp b{min-width:30px;text-align:center;font-size:26px}
.stp button{width:40px;height:40px;border:2px solid var(--ln);background:#fff;border-radius:12px;font-size:22px;font-weight:700;color:#1a2240;box-shadow:0 3px 0 var(--ln);cursor:pointer}
.stp button[disabled]{opacity:.4;cursor:not-allowed}
</style>
<div id="app">
<canvas id="c" tabindex="0"></canvas>
<div id="lobby"><div class="menu" id="menu"></div></div>
<div id="hud" hidden>
<div id="scope" hidden></div>
<div id="dmg"></div>
<div id="dir"><i></i></div>
<div id="beds"></div>
<div id="feed"></div>
<div id="res"></div>
<div id="cross"><i></i><i></i><i></i><i></i></div>
<div id="hit"></div>
<div id="banner"></div>
<div id="vitals"><div class="bar"><b id="hpb"></b><span id="hpt">100</span></div><div class="bar ar"><b id="arb"></b><span id="art">0</span></div></div>

</div>
<div id="shop" hidden></div>
<div id="result" hidden></div>
<div id="load">Loading</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
if(typeof THREE==='undefined'){$('#load').textContent='3D engine failed to load. Reload the page.';return;}
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- save ---------- */
const SAVE_KEY='skybreak_siege_v1';
const save={coins:500,name:'Player',skin:'rookie',finish:'standard',ownedSkins:['rookie'],ownedFinishes:['standard'],sens:1,wins:0,kills:0,matches:0,mode:'duos',diff:'normal'};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s)Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- audio ---------- */
let actx=null,master=null,noiseBuf=null;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.45;master.connect(actx.destination);}catch(e){actx=null;}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function burst(dur,freq,vol,q,type){const a=ac();if(!a||vol<=.003)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.7,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
const s=a.createBufferSource();s.buffer=noiseBuf;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;f.Q.value=q||.7;const g=a.createGain();const t=a.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05);}
function tone(freq,dur,vol,type,slide){const a=ac();if(!a||vol<=.003)return;const o=a.createOscillator();o.type=type||'sine';const t=a.currentTime;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
const SFX={
pistol:v=>{burst(.14,2600,.5*v);tone(180,.09,.3*v,'triangle',-100);},
smg:v=>{burst(.09,3200,.4*v);tone(220,.06,.16*v,'square',-120);},

for(let li=0;li<L.length;li++){const y=L[li][0],rr=L[li][1],col=L[li][2];
for(let dx=-R;dx<=R;dx++)for(let dz=-R;dz<=R;dz++){const d=Math.hypot(dx,dz)+(hash(cx+dx,cz+dz,li)-.5)*1.2;if(d<=rr){let c=col;if(li===0&&padColor!=null&&Math.abs(dx)<=1&&Math.abs(dz)<=1)c=padColor;addVox(cx+dx,y,cz+dz,c);}}}}

function resetView(){

const a=box(.1,.1,.5,b,.2,-.27,.02,vmArms);a.rotation.x=.05;box(.1,.1,.14,t,.16,-.23,-.26,vmArms);
const l=box(.09,.09,.42,b,-.04,-.3,-.05,vmArms);l.rotation.y=.35;box(.09,.09,.12,t,.05,-.25,-.32,vmArms);

function refreshView(){
if(vmGun){vm.remove(vmGun);vmGun=null;}const p=G.me;if(!p)return;
if(p.cur==='blocks'){const def=BLOCKS[p.bt];vmGun=new THREE.Group();box(.22,.22,.22,M(def.color==null?TEAMS[p.team].color:def.color,0,.8),0,0,0,vmGun);vmGun.position.set(.22,-.22,-.45);vmGun.rotation.set(.3,.5,0);}

/* ---------- online play ---------- */
const r2=v=>Math.round(v*100)/100,r3=v=>Math.round(v*1000)/1000;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const net={ws:null,ok:false,everOk:false,id:null,role:null,live:false,room:null,rooms:[],view:'browse',err:'',offline:false,starting:false,evq:[],toq:{},acc:0,sacc:0,byGid:{},shopKey:'',code:'',form:{name:'',priv:false,teams:2,size:4},ping:0,pingT:0,region:'',signName:''};
const MAX_TOTAL=48;
function netUrl(){const q=new URLSearchParams(location.search).get('server');if(q)return q;
if(location.protocol==='http:'||location.protocol==='https:')return(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';return null;}
function netConnect(){
if(net.ws&&(net.ws.readyState===0||net.ws.readyState===1))return;
const url=netUrl();
if(!url){net.offline=true;net.err='';renderOnlineIfOpen();return;}
net.offline=false;net.err='';let ws;
try{ws=new WebSocket(url);}catch(e){net.err='Could not reach the server.';renderOnlineIfOpen();return;}
net.ws=ws;
ws.onopen=()=>{clearInterval(net.pingT);net.pingT=setInterval(()=>netSend({type:'ping',t:performance.now()}),2500);netSend({type:'ping',t:performance.now()});net.ok=true;net.everOk=true;net.err='';netHello();netSend({type:'sub',on:true});renderOnlineIfOpen();};
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}try{onServer(m);}catch(x){console.error(x);}};
ws.onclose=()=>{clearInterval(net.pingT);net.ok=false;net.ws=null;net.room=null;net.view='browse';
if(net.role&&(state==='game'||state==='result'))abortToLobby('Connection to the server was lost');
else{net.err=net.everOk?'Disconnected from the server.':'Could not reach a game server from this page. Online play works when the game is opened from your own server address (see the README).';renderOnlineIfOpen();}};
ws.onerror=()=>{};}
function netSend(o){if(net.ws&&net.ws.readyState===1)net.ws.send(JSON.stringify(o));}
function netHello(){netSend({type:'hello',name:save.name,skin:save.skin,finish:save.finish});}
function gsend(d){netSend({type:'g',d:d});}
function hsend(to,d){netSend({type:'h',to:to,d:d});}
function netEv(e){if(net.role==='host'&&net.live)net.evq.push(e);}
function netTo(gid,e){if(net.role==='host'&&net.live&&gid)(net.toq[gid]||(net.toq[gid]=[])).push(e);}
function netLeave(){netSend({type:'leave'});net.room=null;net.view='browse';net.role=null;net.live=false;net.starting=false;}
function abortToLobby(msg){net.role=null;net.live=false;net.starting=false;backToLobby();tab='online';net.err=msg||'';renderTab();}
function backToRoom(){net.role=null;net.live=false;net.starting=false;backToLobby();tab='online';renderTab();}

/* ----- server messages ----- */
function onServer(m){
switch(m.type){
case 'welcome':net.id=m.id;break;
case 'pong':{net.ping=Math.max(1,Math.round(performance.now()-m.t));const pe=document.getElementById('pingv');if(pe)pe.textContent=net.ping+' ms';break;}
case 'rooms':net.rooms=m.rooms;renderOnlineIfOpen();break;
case 'room':net.room=m.room;net.view='room';net.err='';renderOnlineIfOpen();break;
case 'error':net.err=m.msg;renderOnlineIfOpen();break;
case 'left':if(m.id){onGuestLeft(m.id);}else{net.room=null;net.view='browse';renderOnlineIfOpen();}break;
case 'start':
if(state==='result')backToRoom();
if(state!=='lobby')break;
if(net.room&&net.room.host===net.id)hostBegin(m);else{net.starting=true;renderOnlineIfOpen();}
break;
case 'hostleft':
if(state==='game'||state==='result')abortToLobby('The host left, so the match ended');
else{net.room=null;net.view='browse';net.starting=false;net.err='The host left the room';renderOnlineIfOpen();}
break;
case 'r':if(net.role==='host')onHostMsg(m.from,m.d);else onGuestMsg(m.d);break;}}

/* ----- host side ----- */
function hostBegin(m){
const cfg={teams:m.cfg.teams,size:m.cfg.size,seed:m.cfg.seed,label:net.room&&net.room.name?net.room.name:'Online'};
const bn=BOTNAMES.slice().sort(()=>Math.random()-.5),roster=[];let id=0;
for(let i=0;i<cfg.teams;i++){const hs=m.roster.filter(r=>r.team===i);
for(let s=0;s<cfg.size;s++){const h=hs[s];
if(h)roster.push({id:id++,name:h.name,team:i,slot:s,bot:false,skin:h.skin,finish:h.finish,gid:h.id});
else roster.push({id:id++,name:bn.pop()||('Bot'+(id+1)),team:i,slot:s,bot:true,skin:pick(Object.keys(SKINS)),finish:pick(Object.keys(FINISH)),gid:null});}}
net.role='host';net.live=false;net.evq=[];net.toq={};net.acc=0;net.byGid={};net.starting=false;
setupMatch(cfg,roster);
for(const p of G.players)if(p.gid)net.byGid[p.gid]=p;
net.live=true;
hsend('*',{t:'init',cfg:cfg,roster:roster});}
function onGuestLeft(id){const p=net.byGid[id];if(!p)return;delete net.byGid[id];
p.remote=false;p.bot=true;p.gid=null;p.net=null;p.ai.age=20;p.ai.goal=null;p.ai.raidAt=rnd(10,30);
feed(nameHtml(p)+' disconnected, a bot took over');}
function onHostMsg(from,d){
const p=net.byGid[from];if(!p||!p.remote||!d)return;
switch(d.t){
case 'state':
if(!p.alive||d.q!==p.spawnSeq||![d.x,d.y,d.z,d.yaw,d.pitch].every(Number.isFinite))return;
p.net={x:d.x,y:d.y,z:d.z,yaw:d.yaw,pitch:d.pitch,sn:d.sn,aim:d.aim,walk:d.walk,cur:d.cur};break;
case 'fire':fireRemote(p,d);break;
case 'reload':startReload(p);break;
case 'place':{if(!BLOCKS[d.bt]||![d.x,d.y,d.z].every(Number.isInteger)||!p.alive)return;
const ok=Math.hypot(d.x+.5-p.pos.x,d.z+.5-p.pos.z)<9&&Math.abs(d.y-p.pos.y)<9;
if(ok){const old=p.bt;p.bt=d.bt;if(!placeBlock(p,d.x,d.y,d.z)){p.bt=old;netTo(from,{k:'vdel',x:d.x,y:d.y,z:d.z});}}
else netTo(from,{k:'vdel',x:d.x,y:d.y,z:d.z});break;}
case 'buy':if(p.alive&&typeof d.id==='string')netTo(from,{k:'buyr',r:buy(p,d.id)});break;
case 'chest':{const c=G.chests[d.i];if(c&&!c.open&&p.alive&&chestNear(p)===c)openChest(p,c);break;}}}
function hostTick(dt){
net.acc+=dt;if(net.acc<.066)return;net.acc=0;
const ev=net.evq;net.evq=[];
let P=null,B=null;
for(const p of G.players){if(!p.remote)continue;
if(!P){P=G.players.map(q=>[q.id,r2(q.pos.x),r2(q.pos.y),r2(q.pos.z),r3(q.yaw),r3(q.pitch),q.alive?1:0,Math.round(q.hp),q.cur,r2(q.walk),q.sneak?1:0,q.elim?1:0,Math.round(q.respT*10)/10,Math.round(q.armor)]);
B=G.teams.map(t=>[t.bed.alive?1:0,Math.round(t.bed.hp)]);}
const g={};for(const k in p.guns)g[k]=[p.guns[k].mag,p.guns[k].res===Infinity?-1:p.guns[k].res];
hsend(p.gid,{t:'s',p:P,b:B,ev:ev,to:net.toq[p.gid]||[],me:{res:[p.res.scrap,p.res.gold,p.res.core],bl:[p.blocks.wool,p.blocks.planks,p.blocks.obsidian],bt:p.bt,g:g,rl:r2(p.reloadT)}});}
net.toq={};}

/* ----- guest side ----- */
function onGuestMsg(d){
if(!d)return;
if(d.t==='init'){if(state==='game')return;net.role='guest';net.live=true;net.starting=false;
const cfg=d.cfg;cfg.label=net.room&&net.room.name?net.room.name:'Online';
setupMatch(cfg,d.roster);G.me.seq=1;net.sacc=0;net.shopKey='';return;}
if(net.role!=='guest'||state!=='game')return;
if(d.t==='s')applySnap(d);
else if(d.t==='end')finishMatch(d.w,d.st);}
function applySnap(d){
for(const e of d.ev)applyEv(e);for(const e of d.to)applyEv(e);
for(const a of d.p){const p=G.players[a[0]];if(!p)continue;
if(p===G.me){p.alive=!!a[6];p.hp=a[7];p.elim=!!a[11];p.respT=a[12];p.armor=a[13];}
else{const was=p.alive;p.tpos={x:a[1],y:a[2],z:a[3]};p.yaw=a[4];p.pitch=a[5];p.alive=!!a[6];p.hp=a[7];p.cur=a[8];p.walk=a[9];p.sneak=!!a[10];p.elim=!!a[11];p.respT=a[12];p.armor=a[13];
if(p.alive&&!was){p.pos.set(a[1],a[2],a[3]);p.R.g.visible=true;}if(!p.alive)p.R.g.visible=false;}}
d.b.forEach((b,i)=>{const t=G.teams[i];if(!t)return;t.bed.hp=b[1];if(!b[0]&&t.bed.alive){t.bed.alive=false;bedFx(t,null);}});
const m=d.me,me=G.me;
if(m&&me){me.res.scrap=m.res[0];me.res.gold=m.res[1];me.res.core=m.res[2];me.blocks.wool=m.bl[0];me.blocks.planks=m.bl[1];me.blocks.obsidian=m.bl[2];me.bt=m.bt;
const settled=G.t-me.lastFireT>.4&&me.reloadT<=0;
for(const k in m.g){const v=m.g[k],res=v[1]<0?Infinity:v[1];if(!me.guns[k])me.guns[k]={mag:v[0],res:res};else if(settled){me.guns[k].mag=v[0];me.guns[k].res=res;}}
if(me.cur==='blocks'&&totalBlocks(me)===0){me.cur='pistol';refreshView();}
if(shopOpen){const key=m.res.join()+m.bl.join()+Object.keys(m.g).join();if(key!==net.shopKey){net.shopKey=key;renderShop();}}}}
function applyEv(e){
switch(e.k){
case 'fx':{const p=G.players[e.p];if(!p||p===G.me)break;const a=V3(e.a[0],e.a[1],e.a[2]),b=V3(e.b[0],e.b[1],e.b[2]);tracer(a,b);
if(e.f){const dd=Math.hypot(a.x-camera.position.x,a.z-camera.position.z);play(e.w,Math.pow(clamp(1-dd/90,0,1),1.6));spark(a,[0xffd27a,0xfff2c4],3,2,.05,.12,0);}break;}
case 'kill':{const v=G.players[e.v],a=e.a>=0?G.players[e.a]:null;if(v)killFx(v,a,!!e.h);break;}
case 'spawn':{const p=G.players[e.id];if(!p)break;p.pos.set(e.x,.01,e.z);p.vel.set(0,0,0);p.yaw=e.yaw;p.pitch=0;p.alive=true;p.reloadT=0;p.invuln=2.2;p.tpos={x:e.x,y:.01,z:e.z};
if(p===G.me){p.seq=e.q;p.aim=false;p.R.g.visible=false;}else p.R.g.visible=true;break;}
case 'bed':{const t=G.teams[e.t];if(t&&t.bed.alive){t.bed.alive=false;bedFx(t,e.by>=0?G.players[e.by]:null);}break;}

$('#leave').addEventListener('click',e=>{e.stopPropagation();netLeave();backToLobby();});
function equipSlot(n){const p=G.me;if(!p||!p.alive)return;
if(n===6){if(p.cur==='blocks'){const ks=['wool','planks','obsidian'].filter(k=>p.blocks[k]>0);if(ks.length>1){p.bt=ks[(ks.indexOf(p.bt)+1)%ks.length];refreshView();}}else if(totalBlocks(p)>0){if(!p.blocks[p.bt])p.bt=['wool','planks','obsidian'].find(k=>p.blocks[k]>0);equip(p,'blocks');}else note('No blocks. Open the shop (B)','bad');return;}
const id=Object.keys(WEAPONS).find(k=>WEAPONS[k].slot===n);if(id&&p.guns[id])equip(p,id);}
function cycleWeapon(dir){const p=G.me;if(!p||!p.alive)return;const order=Object.keys(WEAPONS).filter(k=>p.guns[k]);if(totalBlocks(p)>0)order.push('blocks');const i=order.indexOf(p.cur);equip(p,order[(i+dir+order.length)%order.length]);}
window.addEventListener('keydown',e=>{
if(e.target&&e.target.tagName==='INPUT')return;
keys[e.code]=true;
if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
if(state!=='game'||e.repeat)return;
if(e.code==='KeyB'){shopOpen?closeShop():openShop();}
else if(e.code==='Escape'&&shopOpen){shopOpen=false;$('#shop').hidden=true;$('#resume').hidden=false;}
else if(shopOpen)return;
else if(e.code==='KeyE'){const p=G.me;if(p.alive){const c=chestNear(p);if(c){if(net.role==='guest')gsend({t:'chest',i:G.chests.indexOf(c)});else openChest(p,c);}}}
else if(e.code==='KeyR'){startReload(G.me);}
else if(/^Digit[1-6]$/.test(e.code))equipSlot(+e.code.slice(5));});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseDown=false;aimHeld=false;});
window.addEventListener('mousedown',e=>{
if(state==='lobby'){if(e.target===canvas)lobDrag=true;return;}
if(state!=='game'||shopOpen||(!locked&&!softLook))return;
if(e.button===0){mouseDown=true;mouseClick=true;}else if(e.button===2)aimHeld=true;});
window.addEventListener('mouseup',e=>{lobDrag=false;if(e.button===0)mouseDown=false;else if(e.button===2)aimHeld=false;});
window.addEventListener('mousemove',e=>{
if(state==='lobby'){if(lobDrag)lobRot+=e.movementX*.01;return;}
if(state!=='game'||shopOpen||!G.me||!G.me.alive)return;
if(locked||(softLook&&e.buttons)){const k=.0022*save.sens*(camera.fov/75);G.me.yaw-=e.movementX*k;G.me.pitch=clamp(G.me.pitch-e.movementY*k,-1.5,1.5);}});
window.addEventListener('wheel',e=>{if(state==='game'&&!shopOpen&&(locked||softLook))cycleWeapon(e.deltaY>0?1:-1);},{passive:true});
window.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- main loop ---------- */
function simulate(dt){
if(net.role==='guest'){simGuest(dt);return;}
G.t+=dt;updGens(dt);
if(state==='game'&&G.me.alive)updLocal(G.me,dt);mouseClick=false;
for(const p of G.players){if(p.bot)updBot(p,dt);else if(p.remote)updRemote(p,dt);}
updPlayersVisual(dt);followSun(G.me.alive?G.me.pos:V3(0,0,0));
if(net.role==='host'&&net.live)hostTick(dt);}
function gameCam(dt){
const p=G.me;let tf=75;
if(p.alive){camera.position.copy(eyeOf(p));camera.rotation.set(p.pitch,p.yaw,0);
tf=p.aim?(p.cur==='sniper'?16:52):((keys.ShiftLeft||keys.ShiftRight)&&p.walk>.5&&keys.KeyW?80:75);}
else{const a=G.t*.35;camera.position.set(p.pos.x+Math.sin(a)*5,Math.max(p.pos.y,-10)+3.5,p.pos.z+Math.cos(a)*5);camera.lookAt(p.pos.x,Math.max(p.pos.y,-10)+1,p.pos.z);}
camera.fov+=(tf-camera.fov)*Math.min(1,dt*12);camera.updateProjectionMatrix();}
let last=performance.now(),hudT=0;
function loop(now){
requestAnimationFrame(loop);
const dt=Math.min(.05,(now-last)/1000||.016);last=now;
for(const c of clouds){c.position.x+=c.userData.sp*dt;if(c.position.x>320)c.position.x=-320;}
sky.position.copy(camera.position);
if(state==='lobby'){lobbyCam(dt);for(const g of G.gens)g.cube.rotation.y+=dt;}
else{
const paused=state==='game'&&!net.role&&!locked&&!softLook&&!shopOpen;
if(!paused){simulate(dt);}
gameCam(dt);if(!paused)updView(dt);
hudT-=dt;if(hudT<=0&&state==='game'){hudT=.08;updHud();}}
updParts(dt);updTracers(dt);
if(flashT>0){flashT-=dt;if(flashT<=0)flashL.intensity=0;}
renderer.render(scene,camera);}

/* ---------- boot ---------- */
try{
camera.fov=42;camera.updateProjectionMatrix();
buildLobby();initLobby();vm.visible=false;
const ld=$('#load');ld.style.transition='opacity .5s';ld.style.opacity=0;setTimeout(()=>{ld.hidden=true;},550);
requestAnimationFrame(loop);
}catch(err){$('#load').textContent='Startup error: '+err.message;console.error(err);}
})();
</script>
